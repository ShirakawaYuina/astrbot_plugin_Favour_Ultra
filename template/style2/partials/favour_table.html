<article id="content" class="is-ready" aria-live="polite">
  <div class="table-wrap">
    <table class="favour-table favour-table--6">
      <thead>
        <tr>
          <th>用户</th>
          <th>User ID</th>
          <th>好感度</th>
          <th>关系</th>
          <th>今日变化</th>
          <th>印象</th>
        </tr>
      </thead>
      <tbody>
        {% for row in rows %}
        <tr>
          <td>
            <div class="user">
              <span class="avatar" style="background: {{ row.avatar_background }};">
                {% if row.avatar_src %}
                <img alt="" src="{{ row.avatar_src }}" />
                {% else %}
                {{ row.avatar_fallback }}
                {% endif %}
              </span>
              <div>
                <span class="user-name">{{ row.name }}</span>
              </div>
            </div>
          </td>
          <td>{{ row.user_id }}</td>
          <td>
            <div class="meter">
              <span class="score" style="background: {{ row.score_bg }}; color: {{ row.score_color }};">{{ row.favour }}</span>
              <div class="track">
                <div class="fill" style="width: {{ row.score_width }}; background: {{ row.fill }};"></div>
                <span class="heart">
                  <svg viewBox="0 0 32 32" fill="none" aria-hidden="true">
                    {% if row.favour >= 0 %}
                    <path d="M16 27.2C16 27.2 5.6 20.45 5.6 12.55C5.6 8.15 8.8 5.45 12.58 5.45C14.34 5.45 15.52 6.19 16 6.82C16.48 6.19 17.66 5.45 19.42 5.45C23.2 5.45 26.4 8.15 26.4 12.55C26.4 20.45 16 27.2 16 27.2Z" fill="{{ row.heart }}" stroke="rgba(255,255,255,.75)" stroke-width="1.5"/>
                    {% else %}
                    <path d="M16 27.2C16 27.2 5.6 20.45 5.6 12.55C5.6 8.15 8.8 5.45 12.58 5.45C14.34 5.45 15.52 6.19 16 6.82C16.48 6.19 17.66 5.45 19.42 5.45C23.2 5.45 26.4 8.15 26.4 12.55C26.4 20.45 16 27.2 16 27.2Z" fill="{{ row.heart }}" stroke="rgba(255,255,255,.75)" stroke-width="1.5"/>
                    <path d="M14 7L18 14M14 10L18 17" stroke="rgba(255,255,255,.9)" stroke-width="1.5" stroke-linecap="round"/>
                    {% endif %}
                  </svg>
                </span>
              </div>
            </div>
          </td>
          <td>
            <span class="badge" style="background: {{ row.badge_bg }};">{{ row.relationship_text }}</span>
          </td>
          <td>
            <span class="change change--{{ row.today_change_state }}">{{ row.today_change_text }}</span>
          </td>
          <td>
            <span class="impression" style="background: {{ row.impression_bg }};">{{ row.impression_text }}</span>
          </td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</article>
